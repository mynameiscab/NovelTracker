# Version: v2.2.2
# 功能：手动测试爬虫 Workflow
# 增加 SQLite 状态检查输出
# 不设置 schedule，仅支持手动运行

name: Work Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawler-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run crawler test
        run: |
          python crawler.py

      - name: Check database status
        run: |
          python - <<'PY'
          import sqlite3

          db = sqlite3.connect("crawler.db")
          cursor = db.cursor()

          print("=== Crawler Database Status ===")

          try:
              cursor.execute("SELECT title, latest_chapter_title, crawl_time FROM pages LIMIT 1")
              row = cursor.fetchone()
              if row:
                  print("小说:", row[0])
                  print("最新章节:", row[1])
                  print("检测时间:", row[2])
          except Exception as e:
              print("Pages table check failed:", e)

          try:
              cursor.execute("SELECT COUNT(*) FROM chapters")
              print("章节数量:", cursor.fetchone()[0])
          except Exception as e:
              print("Chapter count check failed:", e)

          db.close()
          PY

      - name: Commit test results and database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ crawler.db
          git commit -m "Update crawler test results and database" || echo "No changes to commit"
          git push
