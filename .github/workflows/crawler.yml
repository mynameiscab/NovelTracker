# Version: v1.1
# GitHub Actions 自动运行网页爬虫并提交结果

name: Run Crawler

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 00:00 运行一次
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run crawler
        run: |
          python crawler.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Update crawler results"
          git push
