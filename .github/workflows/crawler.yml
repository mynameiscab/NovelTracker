# Version: v2.1.3
# GitHub Actions 自动运行网页爬虫
# 数据清理由 crawler.py 统一处理

name: Run Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run crawler
        run: |
          python crawler.py

      - name: Commit results and database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ crawler.db
          git commit -m "Update crawler results and database" || echo "No changes to commit"
          git push
